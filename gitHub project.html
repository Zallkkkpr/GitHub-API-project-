<!DOCTYPE html>
<html>
<head>
  <title>My GitHub Projects</title>
  <style>
    body { font-family: Poppins, sans-serif; padding: 20px; }
    .project-card { 
      border: 1px solid #e3f2fd; 
      border-left: 4px solid #1e88e5;
      padding: 16px; 
      border-radius: 12px; 
      margin-bottom: 12px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <h2 style="color:#0d47a1;">💻 My Latest GitHub Projects (Live API)</h2>
  <div id="my-projects">Loading projects from GitHub API...</div>

<script>
async function loadGithubProjects() {
  const username = "zallkkkpr"; // <-- 1. Yaha apna username daalo
  const container = document.getElementById('my-projects');
  
  try {
    // 2. API ko request bhej rahe hai
    const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
    
    if (!response.ok) throw new Error("User not found");
    
    const repos = await response.json();
    
    // 3. Data ko HTML me convert kar rahe hai
    container.innerHTML = ""; // Loading hata diya
    repos.forEach(repo => {
      container.innerHTML += `
        <div class="project-card">
          <h4 style="margin:0 0 5px 0;">📁 ${repo.name}</h4>
          <p style="font-size:13px; color:#666; margin:5px 0;">${repo.description || 'No description added yet'}</p>
          <p style="font-size:12px; margin:5px 0;">⭐ ${repo.stargazers_count} | 🍴 ${repo.forks_count} | 💻 ${repo.language || 'Code'}</p>
          <a href="${repo.html_url}" target="_blank" style="color:#1e88e5; font-weight:bold; text-decoration:none; font-size:13px;">View on GitHub →</a>
        </div>
      `;
    });

  } catch (error) {
    container.innerHTML = `<p style="color:red;">Error: GitHub username sahi nahi hai ya API limit cross ho gayi.</p>`;
    console.log(error);
  }
}

// 4. Function ko call kiya
loadGithubProjects();
</script>
</body>
</html>
